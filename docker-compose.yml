# NutriRuta AG — stack local: frontend (nginx) + API (FastAPI) + worker (AG) + PostgreSQL.
#   docker compose up -d --build                  levanta todo → http://localhost:8090
#   docker compose --profile test run tests       pruebas del backend
name: nutriruta-ag

x-backend: &backend
  build:
    context: .
    dockerfile: backend/Dockerfile
    target: runtime
    args:
      GIT_COMMIT: ${GIT_COMMIT:-}
  image: nutriruta-ag-backend:1.0.0
  environment:
    APP_ENV: ${APP_ENV:-development}
    DB_URL: postgresql+psycopg://${POSTGRES_USER:-nutriruta}:${POSTGRES_PASSWORD:-nutriruta_local}@db:5432/${POSTGRES_DB:-nutriruta}
    MIN_CENTERS: ${MIN_CENTERS:-5}
    MAX_CENTERS: ${MAX_CENTERS:-50}
    MAX_GENERATIONS: ${MAX_GENERATIONS:-1000}
    MAX_UPLOAD_MB: ${MAX_UPLOAD_MB:-5}
    MAX_RUN_SECONDS: ${MAX_RUN_SECONDS:-120}
    CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:8090}
    ADMIN_USERNAME: ${ADMIN_USERNAME:-admin}
    ADMIN_PASSWORD: ${ADMIN_PASSWORD:-NutriRuta2026!}
    ADMIN_NAME: ${ADMIN_NAME:-Administrador}
    SESSION_HOURS: ${SESSION_HOURS:-8}
    COOKIE_SECURE: ${COOKIE_SECURE:-false}
    RATE_LIMIT_ENABLED: ${RATE_LIMIT_ENABLED:-true}
    RATE_LIMIT_PER_MIN: ${RATE_LIMIT_PER_MIN:-1200}
    RATE_LIMIT_HEAVY_PER_MIN: ${RATE_LIMIT_HEAVY_PER_MIN:-30}
    RATE_LIMIT_LOGIN_PER_MIN: ${RATE_LIMIT_LOGIN_PER_MIN:-10}
  depends_on:
    db:
      condition: service_healthy
  restart: unless-stopped

services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-nutriruta}
      POSTGRES_USER: ${POSTGRES_USER:-nutriruta}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-nutriruta_local}
    volumes:
      - db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 512M

  api:
    <<: *backend
    command: ["uvicorn", "app.main:app", "--host", "0.0.0.0", "--port", "8000"]
    ports:
      - "127.0.0.1:${API_PORT:-8010}:8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=3).status == 200 else 1)"]
      interval: 5s
      timeout: 4s
      retries: 20
      start_period: 5s
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 512M

  worker:
    <<: *backend
    command: ["python", "-m", "app.worker"]
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 768M

  frontend:
    build:
      context: ./frontend
    image: nutriruta-ag-frontend:1.0.0
    ports:
      - "${FRONTEND_PORT:-8090}:80"
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1/ || exit 1"]
      interval: 10s
      timeout: 4s
      retries: 6
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 128M

  # Pruebas del backend: unitarias, de propiedades e integración sobre SQLite.
  # Las e2e apuntan al stack en ejecución (E2E_BASE_URL).
  tests:
    profiles: ["test"]
    build:
      context: .
      dockerfile: backend/Dockerfile
      target: test
    image: nutriruta-ag-backend-test:1.0.0
    environment:
      DB_URL: sqlite:////tmp/nutriruta_test.db
      E2E_BASE_URL: ${E2E_BASE_URL:-http://frontend}
    command: ["pytest"]

volumes:
  db_data:
