server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Límite de subida un poco por encima de MAX_UPLOAD_MB (la API aplica el límite real).
    client_max_body_size 6m;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    # OpenStreetMap exige Referer; enviar solo el origen a proveedores externos.
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    location /api/ {
        proxy_pass http://api:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 60s;
    }

    location = /health {
        proxy_pass http://api:8000/health;
    }

    location /assets/ {
        expires 30d;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # Aplicación de una sola página: las rutas del cliente devuelven index.html.
    location / {
        # El HTML debe consultar la versión vigente; los assets tienen hash e inmutabilidad.
        expires -1;
        try_files $uri $uri/ /index.html;
    }
}
