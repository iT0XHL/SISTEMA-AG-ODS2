name: CI

on:
  push:
    branches: [main, develop]
  pull_request:

jobs:
  backend:
    name: Backend · lint, pruebas y dependencias
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements-dev.txt
      - name: Instalar dependencias
        run: pip install -r requirements-dev.txt pip-audit
      - name: Estilo y lint (ruff)
        run: |
          ruff check . ../scripts
          ruff format --check . ../scripts
      - name: Fixtures deterministas al día
        run: |
          python ../scripts/create_demo.py --out ../fixtures
          git diff --exit-code -- ../fixtures
      - name: Pruebas unitarias, de propiedades e integración
        env:
          DB_URL: sqlite:///./ci.db
        run: pytest -m "not e2e" -q
      - name: Escaneo de dependencias
        run: pip-audit -r requirements.txt

  frontend:
    name: Frontend · tipos, lint, pruebas y build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run format:check
      - run: npm test
      - run: npm run build
      - name: Escaneo de dependencias
        run: npm audit --omit=dev --audit-level=high

  e2e:
    name: Stack Docker · extremo a extremo
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    steps:
      - uses: actions/checkout@v4
      - name: Levantar el stack
        run: docker compose up -d --build --wait
      - name: Pruebas e2e (nginx → API → PostgreSQL → worker)
        run: |
          docker compose --profile test build tests
          docker compose --profile test run --rm tests pytest tests/e2e -v
      - name: Cuatro corridas reproducibles
        run: python scripts/export_four_runs.py --api http://localhost:8090 --out evidencia-ci
      - uses: actions/upload-artifact@v4
        with:
          name: evidencia-cuatro-corridas
          path: evidencia-ci
      - name: Logs si algo falla
        if: failure()
        run: docker compose logs --tail=200
